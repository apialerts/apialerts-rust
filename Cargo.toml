[package]
name = "apialerts"
version = "1.1.0"
edition = "2021"
authors = ["API Alerts <support@apialerts.com>"]
description = "Rust client for the API Alerts notification platform"
license = "MIT"
repository = "https://github.com/apialerts/apialerts-rust"
keywords = ["api", "alerts", "notification", "async"]
categories = ["api-bindings", "web-programming::http-client"]
readme = "README.md"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
wiremock = "0.6"

[[example]]
name = "run"
